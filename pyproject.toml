[project]
name = "sarathy"
version = "0.2.0a1"
description = "Sarathy : My Personal AI Assistant (tau-core)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Viswa Kumar"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "tau-ai>=0.3.9,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "textual>=8.2.8,<9.0.0",
    "croniter>=6.0.0,<7.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "watchdog>=3.0.0,<4.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "firecrawl>=2.0.0,<3.0.0",
    "markdown>=3.7.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
sarathy = "sarathy.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sarathy"]

[tool.hatch.build.targets.wheel.sources]
"sarathy" = "sarathy"

# Include non-Python files in skills, templates, web static assets and docs
[tool.hatch.build]
include = [
    "sarathy/**/*.py",
    "sarathy/templates/**/*.md",
    "sarathy/templates/skills/**/*.md",
    "sarathy/skills/**/*.md",
    "sarathy/skills/**/*.sh",
    "sarathy/web/static/**/*",
    "sarathy/data/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "sarathy/",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel.force-include]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
