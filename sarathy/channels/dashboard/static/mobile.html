<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <script>
      // Pre-paint theme bootstrap: apply the saved palette BEFORE first paint so
      // a reload never flashes the default violet. Mirrors THEMES in
      // src/lib/theme.tsx — keep the two lists in step.
      (function () {
        try {
          var MODES = { light: "light", dark: "dark", system: null, matcha: "light", ink: "dark", sand: "light" };
          var SWATCH = { light: "#fafafa", dark: "#09090b", ink: "#1a2333", matcha: "#5f8f52", sand: "#b9744c" };
          var t = localStorage.getItem("sarathy_theme") || "dark";
          if (!(t in MODES)) t = "dark";
          var mode = MODES[t];
          if (mode === null) {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var el = document.documentElement;
          el.classList.toggle("dark", mode === "dark");
          el.classList.remove("theme-matcha", "theme-ink", "theme-sand");
          if (t !== "light" && t !== "dark" && t !== "system") el.classList.add("theme-" + t);
          el.style.colorScheme = mode;
          el.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", SWATCH[t] || (mode === "dark" ? "#09090b" : "#fafafa"));
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>Sarathy • Mobile</title>
    <script>
      (function () {
        // Mobile-native shell: only phones (pointer:coarse + narrow) belong here.
        // Tablets/desktop redirect to the desktop app, unless an explicit
        // ?view=mobile override or sarathy_view cookie asked to stay mobile.
        try {
          var p = new URLSearchParams(window.location.search);
          var m = document.cookie.match(/(?:^|;\s*)sarathy_view=([^;]*)/);
          var override = p.get("view") || (m && m[1]);
          var isPhone =
            window.matchMedia("(pointer: coarse)").matches &&
            window.innerWidth < 768;
          if (!isPhone && override !== "mobile") {
            window.location.replace("/");
          }
        } catch (e) {}
      })();
    </script>
