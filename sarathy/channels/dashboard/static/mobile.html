    <title>Sarathy • Mobile</title>
    <script>
      (function () {
        // Mobile-native shell: only phones (pointer:coarse + narrow) belong here.
        // Tablets/desktop redirect to the desktop app, unless an explicit
        // ?view=mobile override or sarathy_view cookie asked to stay mobile.
        try {
          var p = new URLSearchParams(window.location.search);
          var m = document.cookie.match(/(?:^|;\s*)sarathy_view=([^;]*)/);
          var override = p.get("view") || (m && m[1]);
          var isPhone =
            window.matchMedia("(pointer: coarse)").matches &&
            window.innerWidth < 768;
          if (!isPhone && override !== "mobile") {
            window.location.replace("/");
          }
        } catch (e) {}
      })();
    </script>
